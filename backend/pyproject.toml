[project]
name = "ai-firewall-backend"
version = "0.1.0"
description = "AI Firewall model service powered by Nebius Token Factory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
